<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Price Stalker </title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f13;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    .hero {
      text-align: center;
      margin-bottom: 40px;
    }

    .hero h1 {
      font-size: 48px;
      font-weight: 800;
      background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }

    .hero p {
      color: #9ca3af;
      font-size: 18px;
    }

    .search-box {
      width: 100%;
      max-width: 700px;
      display: flex;
      gap: 12px;
      margin-bottom: 40px;
    }

    .search-box input {
      flex: 1;
      padding: 16px 20px;
      background: #1a1a24;
      border: 1px solid #2d2d3d;
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: #6366f1;
    }

    .search-box input::placeholder {
      color: #4b5563;
    }

    .search-box button {
      padding: 16px 28px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      white-space: nowrap;
    }

    .search-box button:hover { opacity: 0.85; }
    .search-box button:disabled { opacity: 0.5; cursor: not-allowed; }

    .loading {
      display: none;
      text-align: center;
      color: #9ca3af;
      font-size: 16px;
      margin-bottom: 30px;
    }

    .loading.active { display: block; }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #2d2d3d;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .result-card {
      display: none;
      width: 100%;
      max-width: 700px;
      background: #1a1a24;
      border: 1px solid #2d2d3d;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .result-card.active { display: block; }

    .verdict-banner {
      padding: 28px;
      text-align: center;
    }

    .verdict-banner.buy    { background: linear-gradient(135deg, #064e3b, #065f46); border-bottom: 1px solid #047857; }
    .verdict-banner.wait   { background: linear-gradient(135deg, #7c2d12, #92400e); border-bottom: 1px solid #b45309; }
    .verdict-banner.watch  { background: linear-gradient(135deg, #1e3a5f, #1e40af); border-bottom: 1px solid #3b82f6; }

    .verdict-emoji { font-size: 48px; margin-bottom: 8px; }

    .verdict-label {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .verdict-reason {
      font-size: 15px;
      opacity: 0.85;
      max-width: 500px;
      margin: 0 auto;
      line-height: 1.6;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: #2d2d3d;
    }

    .stat-box {
      background: #1a1a24;
      padding: 20px;
      text-align: center;
    }

    .stat-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #6b7280;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
    }

    .stat-value.green { color: #34d399; }
    .stat-value.red   { color: #f87171; }
    .stat-value.blue  { color: #60a5fa; }

    .product-info {
      padding: 20px 24px;
      border-top: 1px solid #2d2d3d;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .product-dot {
      width: 8px;
      height: 8px;
      background: #6366f1;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .product-name {
      font-size: 13px;
      color: #9ca3af;
      line-height: 1.4;
    }

    .trend-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-left: auto;
      flex-shrink: 0;
    }

    .trend-falling { background: #064e3b; color: #34d399; }
    .trend-rising  { background: #7c2d12; color: #fca5a5; }
    .trend-stable  { background: #1e3a5f; color: #93c5fd; }

    .chat-section {
      width: 100%;
      max-width: 700px;
      background: #1a1a24;
      border: 1px solid #2d2d3d;
      border-radius: 16px;
      overflow: hidden;
      display: none;
    }

    .chat-section.active { display: block; }

    .chat-header {
      padding: 16px 20px;
      border-bottom: 1px solid #2d2d3d;
      font-size: 13px;
      color: #9ca3af;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chat-dot {
      width: 8px;
      height: 8px;
      background: #34d399;
      border-radius: 50%;
    }

    .chat-messages {
      padding: 20px;
      min-height: 120px;
      max-height: 300px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      max-width: 85%;
    }

    .message.agent {
      background: #2d2d3d;
      color: #e5e7eb;
      align-self: flex-start;
    }

    .message.user {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: #fff;
      align-self: flex-end;
    }

    .chat-input-row {
      display: flex;
      gap: 10px;
      padding: 16px 20px;
      border-top: 1px solid #2d2d3d;
    }

    .chat-input-row input {
      flex: 1;
      padding: 12px 16px;
      background: #0f0f13;
      border: 1px solid #2d2d3d;
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .chat-input-row input:focus { border-color: #6366f1; }

    .chat-input-row button {
      padding: 12px 20px;
      background: #6366f1;
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .error-msg {
      display: none;
      width: 100%;
      max-width: 700px;
      background: #1a1a24;
      border: 1px solid #7c2d12;
      border-radius: 12px;
      padding: 16px 20px;
      color: #fca5a5;
      font-size: 14px;
    }

    .error-msg.active { display: block; }
  </style>
</head>
<body>

  <div class="hero">
    <h1>🕵️ Price Stalker</h1>
    <p>Paste an Amazon URL. We'll tell you if it's a good deal.</p>
  </div>

  <div class="search-box">
    <input type="text" id="urlInput" placeholder="Paste Amazon product URL here..." />
    <button id="analyzeBtn" onclick="analyze()">Analyze Price</button>
  </div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p id="loadingText">Scraping live price...</p>
  </div>

  <div class="error-msg" id="errorMsg"></div>

  <div class="result-card" id="resultCard">
    <div class="verdict-banner" id="verdictBanner">
      <div class="verdict-emoji" id="verdictEmoji"></div>
      <div class="verdict-label" id="verdictLabel"></div>
      <div class="verdict-reason" id="verdictReason"></div>
    </div>

    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-label">Current Price</div>
        <div class="stat-value" id="statCurrent"></div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Lowest Ever</div>
        <div class="stat-value green" id="statMin"></div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Highest Ever</div>
        <div class="stat-value red" id="statMax"></div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Average</div>
        <div class="stat-value blue" id="statAvg"></div>
      </div>
    </div>

    <div class="product-info">
      <div class="product-dot"></div>
      <div class="product-name" id="productName"></div>
      <div class="trend-badge" id="trendBadge"></div>
    </div>
  </div>

  <div class="chat-section" id="chatSection">
    <div class="chat-header">
      <div class="chat-dot"></div>
      Price Stalker Agent — ask me anything about this product
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="e.g. When is the best time to buy?" onkeydown="if(event.key==='Enter') sendChat()" />
      <button onclick="sendChat()">Ask</button>
    </div>
  </div>

  <script>
    const API_BASE = "http://localhost:8000";
    let currentUrl = "";

    async function analyze() {
      const url = document.getElementById("urlInput").value.trim();
      if (!url) return;

      currentUrl = url;
      const btn = document.getElementById("analyzeBtn");
      const loading = document.getElementById("loading");
      const resultCard = document.getElementById("resultCard");
      const errorMsg = document.getElementById("errorMsg");
      const chatSection = document.getElementById("chatSection");

      btn.disabled = true;
      loading.classList.add("active");
      resultCard.classList.remove("active");
      errorMsg.classList.remove("active");
      chatSection.classList.remove("active");

      setLoadingText("Scraping live price...");
      await sleep(1200);
      setLoadingText("Querying Elastic price history...");
      await sleep(1000);
      setLoadingText("Gemini is analyzing the deal...");

      try {
        const res = await fetch(`${API_BASE}/analyze`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url })
        });

        const data = await res.json();

        if (!res.ok || data.error) {
          throw new Error(data.error || "Something went wrong");
        }

        showResult(data);
        addAgentMessage(`I've analyzed the **${data.product_name}**. Here's my take: ${data.reason} Want to know anything else?`);
        chatSection.classList.add("active");

      } catch (err) {
        errorMsg.textContent = ` ${err.message}`;
        errorMsg.classList.add("active");
      } finally {
        btn.disabled = false;
        loading.classList.remove("active");
      }
    }

    function showResult(data) {
      const card = document.getElementById("resultCard");
      const banner = document.getElementById("verdictBanner");
      const emoji = document.getElementById("verdictEmoji");
      const label = document.getElementById("verdictLabel");
      const reason = document.getElementById("verdictReason");
      const trendBadge = document.getElementById("trendBadge");

      banner.className = "verdict-banner";
      if (data.verdict === "BUY NOW") {
        banner.classList.add("buy");
        emoji.textContent = "🛒";
      } else if (data.verdict === "WAIT") {
        banner.classList.add("wait");
        emoji.textContent = "⏳";
      } else {
        banner.classList.add("watch");
        emoji.textContent = "👀";
      }

      label.textContent = data.verdict;
      reason.textContent = data.reason;

      document.getElementById("statCurrent").textContent = `$${data.current_price}`;
      document.getElementById("statMin").textContent = `$${data.min_price}`;
      document.getElementById("statMax").textContent = `$${data.max_price?.toFixed(2)}`;
      document.getElementById("statAvg").textContent = `$${data.avg_price}`;
      document.getElementById("productName").textContent = data.product_name;

      trendBadge.textContent = `📈 ${data.trend}`;
      trendBadge.className = `trend-badge trend-${data.trend}`;

      card.classList.add("active");
    }

    async function sendChat() {
      const input = document.getElementById("chatInput");
      const msg = input.value.trim();
      if (!msg) return;

      addUserMessage(msg);
      input.value = "";

      try {
        const res = await fetch(`${API_BASE}/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: currentUrl, message: msg })
        });
        const data = await res.json();
        addAgentMessage(data.reply);
      } catch {
        addAgentMessage("Sorry, I couldn't reach the agent right now.");
      }
    }

    function addAgentMessage(text) {
      const msgs = document.getElementById("chatMessages");
      const div = document.createElement("div");
      div.className = "message agent";
      div.textContent = text.replace(/\*\*/g, "");
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function addUserMessage(text) {
      const msgs = document.getElementById("chatMessages");
      const div = document.createElement("div");
      div.className = "message user";
      div.textContent = text;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function setLoadingText(text) {
      document.getElementById("loadingText").textContent = text;
    }

    function sleep(ms) {
      return new Promise(r => setTimeout(r, ms));
    }
  </script>
</body>
</html>
